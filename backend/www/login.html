<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – RSSF / PWDAM</title>
    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        const authImg = document.getElementById("auth-img");
if (authImg && theme === "dark") {
    authImg.src = "img/authimage2.png";
}

    </script>

    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/sessions.js" defer></script>
    <script src="js/login.js" defer></script>
    <script src="js/eye.js" defer> </script>
</head>

<body data-page="login">

    <div class="auth-container">

        <!-- COLUNA ESQUERDA -->
        <div class="auth-left">
            <div class="login-bubble">

                <h1>Login</h1>
                <h3>Iniciar Sessão</h3>

                <input id="login_email" placeholder="Email">

                <div class="password-wrapper">
                    <input id="login_pass" placeholder="Password" type="password">
                    <span class="toggle-pass" onclick="togglePassword('login_pass', this)">
                        <svg class="eye-closed" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5ZM12 16A4 4 0 1 1 12 8A4 4 0 0 1 12 16Z" />
                        </svg>
                        <svg class="eye-open" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5Z" />
                            <path d="M4 4L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </div>

                <button id="loginButton">Entrar</button>

                <div id="login_error"></div>

                <p class="small-muted" style="margin-top:20px;">Ainda não tem conta?</p>
                <p><a href="register.html">Registar nova conta</a></p>

            </div>
        </div>

        <!-- COLUNA DIREITA (IMAGEM) -->
        <div class="auth-right">
            <img id="auth-img"  alt="Imagem Login">
        </div>

    </div>

    <script>
        window.onload = function () {
            if (typeof redirectIfLoggedIn === "function") redirectIfLoggedIn();
            const loginBtn = document.getElementById("loginButton");
            if (loginBtn && typeof loginPage === "function") loginBtn.onclick = loginPage;
        };
    </script>

</body>

</html>
