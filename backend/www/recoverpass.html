<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Palavra-Passe</title>
            <link rel="icon" href="img/favicon.ico" type="image/x-icon">

    
    <script>
        // Tema e Imagem dinâmicos
        document.addEventListener("DOMContentLoaded", () => {
            const theme = localStorage.getItem('theme');
            const authImg = document.getElementById("auth-img");
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (authImg) authImg.src = "img/authimage2.png";
            } else {
                if (authImg) authImg.src = "img/authimage.png"; // Imagem padrão light
            }
        });
    </script>

    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <link rel="stylesheet" href="css/toasts.css">
<script src="js/toasts.js"></script>
    <script src="js/sessions.js" defer></script>
    <script src="js/recoverpass.js" defer></script>
    <script src="js/eye.js" defer></script>
</head>

<body data-page="recover">

    <div class="auth-container">

        <div class="auth-left">
            <div class="login-bubble">

                <h1>Recuperar Palavra-Passe</h1>
                <h3>Insira o seu e-mail para receber um código para recuperar a sua conta</h3>

                <input id="recover_email" type="email" placeholder="Email">

                <button id="recoverButton">Enviar</button>

                <div id="recover_error" style="display: none; color: #ff4d4d; margin-top: 10px; font-size: 14px;"></div>

                <p class="small-muted" style="margin-top:20px;">Lembrei da Palavra-Passe?</p>
                <p><a href="login.html">Iniciar Sessão</a></p>

            </div>
        </div>

        <div class="auth-right">
            <img id="auth-img" alt="Imagem Recuperar">
        </div>

    </div>

</body>
</html>
