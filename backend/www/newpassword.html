<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar Palavra-Passe</title>
    
    <script>
        // Lógica de Tema e Imagem
        document.addEventListener("DOMContentLoaded", () => {
            const theme = localStorage.getItem('theme');
            const authImg = document.getElementById("auth-img");
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (authImg) authImg.src = "img/authimage2.png";
            } else {
                if (authImg) authImg.src = "img/authimage.png";
            }
        });
    </script>

    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/toasts.css">
<script src="js/toasts.js"></script>
    
    <script src="js/sessions.js" defer></script>
    <script src="js/newpassword.js" defer></script>
    <script src="js/eye.js" defer></script>
</head>

<body data-page="reset-password">

    <div class="auth-container">

        <div class="auth-left">
            <div class="login-bubble">

                <h1>Mudar Palavra-Passe</h1>
                <h3>Altere a sua palavra-passe para uma que seja fácil de lembrar</h3>

                <div class="password-wrapper">
                    <input id="new_pass" placeholder="Nova Password" type="password">
                    <span class="toggle-pass" onclick="togglePassword('new_pass', this)">
                        <svg class="eye-closed" viewBox="0 0 24 24">
                            <path d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5ZM12 16A4 4 0 1 1 12 8A4 4 0 0 1 12 16Z" />
                        </svg>
                        <svg class="eye-open" viewBox="0 0 24 24" style="display:none;">
                            <path d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5Z" />
                            <path d="M4 4L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </div>

                <div class="password-wrapper">
                    <input id="new_pass2" placeholder="Confirmar Nova Password" type="password">
                    <span class="toggle-pass" onclick="togglePassword('new_pass2', this)">
                        <svg class="eye-closed" viewBox="0 0 24 24">
                            <path d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5ZM12 16A4 4 0 1 1 12 8A4 4 0 0 1 12 16Z" />
                        </svg>
                        <svg class="eye-open" viewBox="0 0 24 24" style="display:none;">
                            <path d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5Z" />
                            <path d="M4 4L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </div>

                <button id="resetButton">Confirmar</button>

                <div id="reset_error" style="display:none; color: #ff4d4d; margin-top:15px; font-size: 14px; text-align: center;"></div>
                <div id="reset_success" style="display:none; color: #2ecc71; margin-top:15px; font-size: 14px; text-align: center;"></div>

                <p class="small-muted" style="margin-top:20px;">Lembrei da Palavra-Passe?</p>
                <p><a href="login.html">Iniciar Sessão</a></p>

            </div>
        </div>

        <div class="auth-right">
            <img id="auth-img" alt="Imagem Nova Password">
        </div>

    </div>

</body>
</html>
