<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudar Palavra-Passe – RSSF / PWDAM</title>
    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        const authImg = document.getElementById("auth-img");
if (authImg && theme === "dark") {
    authImg.src = "img/authimage2.png";
}

    </script>

    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/sessions.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/eye.js" defer> </script>
</head>

<body data-page="reset-password">

    <div class="auth-container">

        <!-- COLUNA ESQUERDA -->
        <div class="auth-left">
            <div class="login-bubble">

                <h1>Mudar Palavra-Passe</h1>
                <h3>Altere a sua palavra-passe para uma que seja fácil de lembrar</h3>

                <!-- NOVA PASSWORD -->
                <div class="password-wrapper">
                    <input id="new_pass" placeholder="Nova Password" type="password">
                    <span class="toggle-pass" onclick="togglePassword('new_pass', this)">
                        <svg class="eye-closed" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5ZM12 16A4 4 0 1 1 12 8A4 4 0 0 1 12 16Z" />
                        </svg>
                        <svg class="eye-open" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5Z" />
                            <path d="M4 4L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </div>

                <!-- CONFIRMAR PASSWORD -->
                <div class="password-wrapper">
                    <input id="new_pass2" placeholder="Confirmar Nova Password" type="password">
                    <span class="toggle-pass" onclick="togglePassword('new_pass2', this)">
                        <svg class="eye-closed" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5ZM12 16A4 4 0 1 1 12 8A4 4 0 0 1 12 16Z" />
                        </svg>
                        <svg class="eye-open" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C6.5 4.5 2 8.1 0.5 12C2 15.9 6.5 19.5 12 19.5C17.5 19.5 22 15.9 23.5 12C22 8.1 17.5 4.5 12 4.5Z" />
                            <path d="M4 4L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </div>

                <button id="resetButton">Confirmar</button>

                <div id="reset_error"></div>
                <div id="reset_success"></div>

                <p class="small-muted" style="margin-top:20px;">Lembrei da Palavra-Passe?</p>
                <p><a href="login.html">Iniciar Sessão</a></p>

            </div>
        </div>

        <!-- COLUNA DIREITA -->
        <div class="auth-right">
            <img id="auth-img"  alt="Imagem Nova Password">
        </div>

    </div>

    <script>
        window.onload = function () {
            const btn = document.getElementById("resetButton");

            btn.onclick = () => {
                const pass1 = document.getElementById("new_pass").value;
                const pass2 = document.getElementById("new_pass2").value;

                const err = document.getElementById("reset_error");
                const ok = document.getElementById("reset_success");

                err.textContent = "";
                ok.textContent = "";
                err.style.display = "none";
                ok.style.display = "none";

                if (!pass1 || !pass2) {
                    err.textContent = "Preencha ambos os campos.";
                    err.style.display = "block";
                    return;
                }

                if (pass1 !== pass2) {
                    err.textContent = "As passwords não coincidem.";
                    err.style.display = "block";
                    return;
                }

                if (pass1.length < 8) {
                    err.textContent = "A password deve ter pelo menos 8 caracteres.";
                    err.style.display = "block";
                    return;
                }

                // Aqui farás o fetch para atualizar a password no backend
                ok.textContent = "Password atualizada com sucesso!";
                ok.style.display = "block";
            };
        };
    </script>

</body>

</html>
